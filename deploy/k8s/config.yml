apiVersion: v1
kind: ConfigMap
metadata:
  name: mooship
data:
  MOODLE_DB_TYPE: pgsql
  MOODLE_DB_HOST: database.example.internal
  MOODLE_DB_NAME: moodle
  MOODLE_DB_USER: moodle
  MOODLE_DB_PASSWORD_FILE: /run/secrets/db/password
  MOODLE_WWWROOT: http://moodle.example.org
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mooship-data
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
