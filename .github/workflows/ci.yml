name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax and ShellCheck
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          for file in "${files[@]}"; do bash -n "$file"; done
          shellcheck -S warning "${files[@]}"

  quality:
    name: Python and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned CI tools
        run: python -m pip install -r .github/requirements.txt
      - name: Python lint
        run: python -m ruff check lib tests .github/scripts
      - name: YAML syntax and duplicate keys
        run: python -m yamllint .github
      - name: GitHub Actions syntax
        run: docker run --rm --read-only --network none -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: GitHub Actions security
        run: zizmor --offline --strict-collection .github

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12', '3.14']
        os: [ubuntu-24.04]
        include:
          - python: '3.12'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Regression tests
        run: python -B -m unittest discover -s tests -v

  coverage:
    name: Python branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned CI tools
        run: python -m pip install -r .github/requirements.txt
      - name: Measure helpers, including Python processes started through Bash
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error
