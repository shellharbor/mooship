name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned CI tools
        run: python -m pip install -r .github/requirements.txt
      - name: Bandit
        run: python -m bandit -r lib src .github/scripts -c .github/bandit.yml

  secrets:
    name: Secrets in files and Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with redacted output
        run: |
          # Container and runner UIDs differ: trust only this read-only checkout.
          args=(--rm --read-only --network none -v "$PWD:/repo:ro"
                -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo)
          # Gitleaks can report zero commits after a Git ownership error; fail first.
          commits=$(docker run "${args[@]}" --entrypoint git ghcr.io/gitleaks/gitleaks:v8.30.1 -C /repo rev-list --all --count)
          test "$commits" -gt 0
          docker run "${args[@]}" ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts=--all --redact --no-banner --config /repo/.gitleaks.toml /repo
          docker run "${args[@]}" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner --config /repo/.gitleaks.toml /repo
