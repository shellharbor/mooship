# Bounded container logs: Docker's default json-file driver never rotates
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  php:
    build:
      context: ./.docker/php
      dockerfile: php${PHP_VERSION}.Dockerfile
    container_name: "{SLUG}_php"
    restart: always
    logging: *default-logging
    # Moodle stores sessions in Redis (config.php)
    depends_on:
      - redis
    environment:
      # Pool size from the resource profile in .env, read by .config/php/fpm-pool.conf
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-8}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-4}
    ports:
      # Localhost only: nginx reaches PHP through the internal network; externally exposed FastCGI allows code execution
      - "127.0.0.1:${PHP_PORT}:9000"
    volumes:
      - ./public_html:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./.config/php/php${PHP_VERSION}.ini:/usr/local/etc/php/php.ini:ro
      # Moodle limits and OPcache (loaded after php.ini) and the PHP-FPM pool size
      - ./.config/php/mooship.ini:/usr/local/etc/php/conf.d/zz-mooship.ini:ro
      - ./.config/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-mooship.conf:ro
    networks:
      - "{SLUG}"
  nginx:
    build:
      context: ./.docker/nginx
      dockerfile: nginx-1.29.1.Dockerfile
    # Reload the configuration every 6 hours to pick up certificates renewed by certbot_renew
    command: /bin/sh -c 'while :; do sleep 21600 & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    container_name: "{SLUG}_nginx"
    restart: always
    logging: *default-logging
    working_dir: /var/www/html
    depends_on:
      - php
      - db
    volumes:
      - ./public_html:/var/www/html:ro
      - ./moodledata:/var/www/moodledata:ro
      - ./.config/nginx/_site.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginxproxy/logs/{SLUG}:/var/log/nginx
      # docker cp {SLUG}_nginx:/etc/nginx/nginx.conf /var/www/{SLUG}/.config/nginx/nginx.conf
      #- ./.config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - "{SLUG}_ssl_certificates:/etc/letsencrypt:ro"
      - "{SLUG}_certbot_www:/var/www/certbot"
      #- ../nginxproxy/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
      # cd /var/www/{SLUG}/.config/nginx && docker run --rm httpd:2.4-alpine htpasswd -nb USERNAME PASSWORD > .htpasswd
      #- ./.config/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - "{SLUG}"
  db_postgres:
    image: postgres:17-alpine
    container_name: "{SLUG}_db_postgres"
    restart: always
    logging: *default-logging
    # Memory settings from the resource profile in .env; parallel queries use /dev/shm
    shm_size: ${DB_SHM_SIZE:-256mb}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    environment:
      POSTGRES_DB: ${DB_POSTGRES_NAME}
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    volumes:
      - "{SLUG}_db_postgres:/var/lib/postgresql/data"
      # docker cp {SLUG}_db_postgres:/var/lib/postgresql/data/postgresql.conf /var/www/{SLUG}/.config/postgres/postgresql.conf
      #- ./.config/postgres/postgresql.conf:/var/lib/postgresql/data/postgresql.conf:ro
      #- ./.docker/init/postgres:/docker-entrypoint-initdb.d
    networks:
      - "{SLUG}"
  db_mysql:
    # 8.4 LTS: Moodle 5.x requires MySQL 8.4+, and Innovation releases (9.x) have short support
    image: mysql:8.4
    container_name: "{SLUG}_db_mysql"
    restart: always
    logging: *default-logging
    # Buffer pool from the resource profile in .env
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
    environment:
      MYSQL_DATABASE: ${DB_MYSQL_NAME}
      MYSQL_USER: ${DB_MYSQL_USER}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASSWORD_ROOT}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    volumes:
      - "{SLUG}_db_mysql:/var/lib/mysql"
      # docker cp {SLUG}_db_mysql:/etc/mysql/my.cnf /var/www/{SLUG}/.config/mysql/my.cnf
      #- ./.config/mysql/my.cnf:/etc/mysql/my.cnf:ro
    networks:
      - "{SLUG}"
  permissions:
    image: alpine:3.24
    container_name: "{SLUG}_permissions"
    volumes:
      - ./public_html:/var/www/html
      - ./moodledata:/var/www/moodledata
    command: >
      sh -c "
        chown -R 1000:1000 /var/www/html &&
        chmod -R 755 /var/www/html &&
        chown -R 1000:1000 /var/www/moodledata &&
        chmod -R 777 /var/www/moodledata &&
        if [ -f /var/www/html/config.php ]; then chmod 600 /var/www/html/config.php; fi
      "
    networks:
      - "{SLUG}"
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: "{SLUG}_certbot"
    depends_on:
      - nginx
    volumes:
      - "{SLUG}_ssl_certificates:/etc/letsencrypt"
      - "{SLUG}_certbot_www:/var/www/certbot"
    networks:
      - "{SLUG}"
  certbot_renew:
    image: certbot/certbot:v5.8.0
    container_name: "{SLUG}_certbot_renew"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - "{SLUG}_ssl_certificates:/etc/letsencrypt"
      - "{SLUG}_certbot_www:/var/www/certbot"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - "{SLUG}"
  redis:
    image: redis:8-alpine
    container_name: "{SLUG}_redis"
    restart: always
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - "{SLUG}_redis_data:/data"
    networks:
      - "{SLUG}"
  cron:
    build:
      context: ./.docker/php
      dockerfile: php${PHP_VERSION}.Dockerfile
    container_name: "{SLUG}_cron"
    restart: always
    logging: *default-logging
    depends_on:
      - php
      - db
    volumes:
      - ./public_html:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./.config/php/php${PHP_VERSION}.ini:/usr/local/etc/php/php.ini:ro
      - ./.config/php/mooship.ini:/usr/local/etc/php/conf.d/zz-mooship.ini:ro
    # Run Moodle cron every minute (the image uses Debian and runs as www; crond/crontab are unsuitable here)
    entrypoint: >
      sh -c "while true; do
        php /var/www/html/admin/cli/cron.php > /dev/null
        sleep 60
      done"
    networks:
      - "{SLUG}"

networks:
  "{SLUG}":
    name: "{SLUG}"
    external: true

volumes:
  "{SLUG}_db_postgres":
    name: "{SLUG}_db_postgres"
  "{SLUG}_db_mysql":
    name: "{SLUG}_db_mysql"
  "{SLUG}_ssl_certificates":
    name: "{SLUG}_ssl_certificates"
  "{SLUG}_certbot_www":
    name: "{SLUG}_certbot_www"
  "{SLUG}_redis_data":
    name: "{SLUG}_redis_data"
