; Mooship settings for Moodle. Mounted as conf.d/zz-mooship.ini in the php and cron containers,
; so these values override phpXX.ini. Edit per project, then: docker compose restart php cron

; Upload limits: nginx (project and nginxproxy) accept up to 2048 MB; PHP sets the effective limit.
; post_max_size must exceed upload_max_filesize to leave room for the rest of the form.
upload_max_filesize = 1024M
post_max_size = 1100M

; Course backup/restore and large reports need more than the stock 128M / 30 s.
; nginx waits up to 300 s for PHP (fastcgi_read_timeout).
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
; Required by Moodle 4.x and later
max_input_vars = 5000

expose_php = Off

; OPcache, following Moodle's recommendations (docs.moodle.org, "OPcache")
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.use_cwd = 1
opcache.save_comments = 1
