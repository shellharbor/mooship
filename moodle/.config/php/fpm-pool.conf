; Mooship PHP-FPM pool settings, mounted as php-fpm.d/zz-mooship.conf so they apply after the
; image's www.conf and zz-docker.conf. The image default (pm.max_children = 5) serves only five
; concurrent Moodle requests.
;
; The pool size comes from the resource profile in the project's .env (PHP_FPM_* variables,
; passed to the container by docker-compose.yml). A Moodle worker typically uses 50-100 MB.
; Change the values in .env, then run: docker compose up -d php
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
; Recycle workers periodically to contain memory growth in long-running processes
pm.max_requests = 500
