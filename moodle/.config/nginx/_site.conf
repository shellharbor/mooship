server {
	listen 80;
	server_name MYSITE.COM;
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        default_type "text/plain";
        root /var/www/certbot;
        try_files $uri =404;

        error_log /var/log/nginx/acme_debug.log debug;
        access_log /var/log/nginx/acme_access.log;
    }

    access_log /var/log/nginx/access.MYSITE.COM.log;
    error_log  /var/log/nginx/error_warn.MYSITE.COM.log warn;
    error_log  /var/log/nginx/error_crit.MYSITE.COM.log crit;
    error_log  /var/log/nginx/error_debug.MYSITE.COM.log debug;
	#return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl;
	server_name MYSITE.COM;

    charset UTF-8;
        server_tokens off;
        index index.php index.html index.htm;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve secp384r1;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Disposition;
        proxy_pass_header Content-Length;
        proxy_read_timeout 300;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;

        client_body_buffer_size 128k;
        client_header_buffer_size 32k;
        client_max_body_size 2048M;
        client_body_timeout 300s;
        client_header_timeout 300s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        gzip on;
        gzip_vary on;
        gzip_static on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 4 32k;
        gzip_http_version 1.1;
        gzip_min_length 1000;
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rss+xml
            application/vnd.geo+json
            application/vnd.ms-fontobject
            application/x-font-ttf
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            font/opentype
            image/bmp
            image/svg+xml
            image/x-icon
            text/cache-manifest
            text/css
            text/plain
            text/vcard
            text/vnd.rim.location.xloc
            text/vtt
            text/x-component
            text/x-cross-domain-policy;

        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 2m;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        root /var/www/html;

        ssl_certificate /etc/letsencrypt/live/MYSITE.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/MYSITE.COM/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/MYSITE.COM/chain.pem;

        large_client_header_buffers 4 32k;
        keepalive_timeout 300s;
        send_timeout 300s;

        access_log /var/log/nginx/access.MYSITE.COM.log;
        error_log  /var/log/nginx/error_warn.MYSITE.COM.log warn;
        error_log  /var/log/nginx/error_crit.MYSITE.COM.log crit;
        error_log  /var/log/nginx/error_debug.MYSITE.COM.log debug;
        rewrite_log on;

#        auth_basic "Restricted Access";
#        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info  ^(.+\.php)(/.+)$;
            fastcgi_index            index.php;
            fastcgi_pass             {SLUG}_php:9000;
            include                  fastcgi_params;
            fastcgi_param   PATH_INFO       $fastcgi_path_info;
            fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ^~ /.well-known/acme-challenge/ {
            auth_basic off;
            allow all;
            default_type "text/plain";
            root /var/www/certbot;
            try_files $uri =404;

            error_log /var/log/nginx/acme_debug.log debug;
            access_log /var/log/nginx/acme_access.log;
        }

        location /dataroot/ {
            internal;
            alias /var/www/moodledata/;
        }

        location ~* \.(jpg|jpeg|gif|png|ico|css|bmp|swf|js|mov|avi|mp4|mpeg4|ttf|woff|woff2)\$ {
            access_log off;
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public, no-transform, mustrevalidate, proxy-revalidate";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }
        
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }
}
