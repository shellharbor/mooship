####### SLUG #######
# The project container is resolved per request through Docker's DNS (127.0.0.11): a stopped
# or crashed project returns 502 for its own domain instead of preventing nginxproxy from
# starting or reloading for every other site.
server {
    listen 80;
    server_name DOMAIN;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mooship_upstream SLUG_nginx;

    location / {
        proxy_pass http://$mooship_upstream:80;
        proxy_http_version 1.1;
        # Stream uploads to the project instead of buffering them twice
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name DOMAIN;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mooship_upstream SLUG_nginx;

    ssl_certificate /etc/letsencrypt/SLUG/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/SLUG/live/DOMAIN/privkey.pem;

    large_client_header_buffers 4 32k;
    keepalive_timeout 60s;
    send_timeout 300s;

    location / {
        proxy_pass https://$mooship_upstream:443;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
