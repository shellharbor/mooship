####### SLUG #######
upstream SLUG {
    server SLUG_nginx:80;
}

upstream SLUG_https {
    server SLUG_nginx:443;
}

upstream SLUG_php {
    server SLUG_php max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name DOMAIN;
    
    location / {
        proxy_pass http://SLUG;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    #return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/SLUG/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/SLUG/live/DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/SLUG/live/DOMAIN/chain.pem;

    large_client_header_buffers 4 32k;
    keepalive_timeout 60s;
    send_timeout 60s;

    access_log /var/log/nginx/access.DOMAIN.log;
    error_log  /var/log/nginx/error_warn.DOMAIN.log warn;
    error_log  /var/log/nginx/error_crit.DOMAIN.log crit;
    error_log  /var/log/nginx/error_debug.DOMAIN.log debug;

    location / {
        proxy_pass https://SLUG_https;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
