[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
ping.path = /fpm-ping
security.limit_extensions = .php
